<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="配色：深蓝黑底 + 冷色担任信息 + 暖色担任情绪 / palette: deep blue-black base, cool colors for information, warm colors for mood">
  <defs>
    <style>
      .mono { font-family: Consolas, "Cascadia Mono", "Courier New", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="220" rx="14" fill="#0a0e14"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="14" fill="none" stroke="#1f2733"/>

  <text class="mono" x="20" y="48" font-size="15" letter-spacing="2.5" fill="#3fd07a">PALETTE</text>
  <text class="sans" x="128" y="48" font-size="15" fill="#7b8a9c">我自己代码里抠出来的，跨 4+ 个项目一致 / pulled from my own code, consistent across 4+ projects</text>
  <path d="M20 64h960" stroke="#1f2733"/>

  <g>
    <rect x="20"  y="84" width="110" height="64" rx="10" fill="#0a0e14" stroke="#2a3543"/>
    <rect x="142" y="84" width="110" height="64" rx="10" fill="#10151d" stroke="#2a3543"/>
    <rect x="264" y="84" width="110" height="64" rx="10" fill="#1f2733" stroke="#2a3543"/>

    <rect x="386" y="84" width="110" height="64" rx="10" fill="#5cc8ff"/>
    <rect x="508" y="84" width="110" height="64" rx="10" fill="#4d6bfe"/>

    <rect x="630" y="84" width="110" height="64" rx="10" fill="#3fd07a"/>
    <rect x="752" y="84" width="110" height="64" rx="10" fill="#e8c15a"/>
    <rect x="874" y="84" width="106" height="64" rx="10" fill="#e0573a"/>
  </g>

  <g class="mono" font-size="14" fill="#dfe8f0">
    <text x="20"  y="176">#0a0e14</text>
    <text x="142" y="176">#10151d</text>
    <text x="264" y="176">#1f2733</text>
    <text x="386" y="176">#5cc8ff</text>
    <text x="508" y="176">#4d6bfe</text>
    <text x="630" y="176">#3fd07a</text>
    <text x="752" y="176">#e8c15a</text>
    <text x="874" y="176">#e0573a</text>
  </g>
  <g class="sans" font-size="13" fill="#7b8a9c">
    <text x="20"  y="200">底 · bg</text>
    <text x="142" y="200">卡片 · card</text>
    <text x="264" y="200">描边 · line</text>
    <text x="386" y="200">信息 · info</text>
    <text x="508" y="200">强调 · accent</text>
    <text x="630" y="200">状态 · ok</text>
    <text x="752" y="200">情绪 · mood</text>
    <text x="874" y="200">警告 · danger</text>
  </g>
</svg>
