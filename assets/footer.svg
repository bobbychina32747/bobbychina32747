<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 124" width="1000" height="124" role="img" aria-label="页脚：没有 CI 徽章，因为徽章也是自己画的 / no CI badges — the badges are hand-drawn too">
  <defs>
    <style>
      .mono { font-family: Consolas, "Cascadia Mono", "Courier New", monospace; }
      @media (prefers-reduced-motion: no-preference) {
        .cursor { animation: blink 1.1s steps(1, end) infinite; }
      }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    </style>
  </defs>
  <rect width="1000" height="124" rx="14" fill="#0d1219"/>
  <rect x="0.5" y="0.5" width="999" height="123" rx="14" fill="none" stroke="#1f2733"/>

  <text class="mono" x="28" y="40" font-size="15" fill="#dfe8f0">
    <tspan fill="#3fd07a">bobby@legion</tspan><tspan fill="#7b8a9c">:~$ </tspan><tspan fill="#5cc8ff">cat README.md</tspan><tspan fill="#7b8a9c"> --tail</tspan>
  </text>
  <text class="mono" x="28" y="72" font-size="14.5" fill="#93a3b5">这里没有 CI 徽章，因为徽章也是我自己画的（第三方脚本一个都不加载）</text>
  <text class="mono" x="28" y="102" font-size="13.5" fill="#7b8a9c">no CI badges — the badges are hand-drawn too, and zero third-party scripts get loaded</text>
  <rect class="cursor" x="676" y="56" width="9" height="16" fill="#3fd07a"/>
